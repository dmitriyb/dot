# templates library — the faber-stack-service-li divergence point. Hooks,
# skills and workflows are the base playground's (referenced); only the agent
# bindings change:
#   implement / implement-next / fix  ->  goose + local qwen (goose-spex-box)
#   review / merge                    ->  unchanged from ../faber-stack-service
#                                         (review opus/high; merge sonnet/low,
#                                         deterministic postlude-only)
#
# Goose env/config rationale: see ../spexmachina-li/templates.yaml — identical
# apart from the instance names (gate portitor-faber-stack-service, sidecar
# faber-stack-service-llm).

templates:
  implement:
    image: goose-spex-box
    identity: implementer
    run:
      resources: {memory: 8g, cpus: 4}
      env:
        FABER_AGENT_CLI: goose
        PORTITOR_HOST: portitor-faber-stack-service
        GOOSE_PROVIDER: openai
        GOOSE_MODEL: qwen/qwen3.8-27b
        GOOSE_MODE: auto
        OPENAI_HOST: http://faber-stack-service-llm:1234
        OPENAI_BASE_PATH: v1/chat/completions
        OPENAI_API_KEY: lm-studio
        GOOSE_DISABLE_KEYRING: "1"
    skill: implement
    model: qwen/qwen3.8-27b
    # <|think_low|> is the froggeric fixed-template's inline reasoning level.
    # Setup it requires (measured 2026-08-19): the fixed template installed for
    # this model in LM Studio AND the GGUF variant loaded — the llama.cpp
    # engine's tool-call parser survives a template override, the MLX one does
    # not. think_off dropped task parts; think_low kept compliance at ~1/8 the
    # tokens of stock xhigh.
    effort: "Follow the operating instructions exactly. Batch independent shell commands into a single call instead of one command per turn. <|think_low|>"
    invoke:
      profile: goose
    skills: [implement, go-expert]
    skills_link: .claude/skills          # kept: the skill texts reference ~/.claude/skills/... paths
    hooks:
      context: gather-context
      prelude: claim-bead
      postlude: post-implement
      on_failure: release-bead
    inputs:
      repo: {type: string, required: true}
      bead: {type: string, required: true}
    output:
      branch: {type: string, required: true}
      pr:     {type: int,    required: true}

  implement-next:
    image: goose-spex-box
    identity: implementer
    run:
      resources: {memory: 8g, cpus: 4}
      env:
        FABER_AGENT_CLI: goose
        PORTITOR_HOST: portitor-faber-stack-service
        GOOSE_PROVIDER: openai
        GOOSE_MODEL: qwen/qwen3.8-27b
        GOOSE_MODE: auto
        OPENAI_HOST: http://faber-stack-service-llm:1234
        OPENAI_BASE_PATH: v1/chat/completions
        OPENAI_API_KEY: lm-studio
        GOOSE_DISABLE_KEYRING: "1"
    skill: implement
    model: qwen/qwen3.8-27b
    # <|think_low|> is the froggeric fixed-template's inline reasoning level.
    # Setup it requires (measured 2026-08-19): the fixed template installed for
    # this model in LM Studio AND the GGUF variant loaded — the llama.cpp
    # engine's tool-call parser survives a template override, the MLX one does
    # not. think_off dropped task parts; think_low kept compliance at ~1/8 the
    # tokens of stock xhigh.
    effort: "Follow the operating instructions exactly. Batch independent shell commands into a single call instead of one command per turn. <|think_low|>"
    invoke:
      profile: goose
      # The epic-cycle output contract is the one instruction the local model
      # kept missing while it lived only in the skill prose — pin it in the
      # prompt. An inline override REPLACES the profile's prompt_template, so
      # the skill-read instruction is repeated here.
      prompt_template: "Read the file /faber/skills/{skill}/SKILL.md and follow it as your operating instructions for this task.\n\n{body}{extra}\n\nMANDATORY: your $FABER_RESULT_DIR/output.json must contain the key \"done\" (boolean; false on a work cycle, true only when CONTEXT.md declares a done-cycle) and, on a work cycle, also \"branch\" (string) and \"pr\" (number)."
    skills: [implement, go-expert]
    skills_link: .claude/skills
    hooks:
      context: next-bead-context
      prelude: claim-next-bead
      postlude: post-implement
      on_failure: release-bead
    inputs:
      repo: {type: string, required: true}
      epic: {type: string, required: true}
    output:
      done:   {type: bool,   required: true}
      branch: {type: string}
      pr:     {type: int}
      halt_reason: {type: string}
      drift_files: {type: string}

  review:
    image: spex-box
    identity: reviewer
    run:
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-faber-stack-service}
    skill: review
    model: claude-opus-5
    effort: high
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    skills: [review, go-expert]
    skills_link: .claude/skills
    hooks:
      context: fetch-pr
      postlude: post-review
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      verdict: {type: string, enum: [approved, changes], required: true}

  fix:
    image: goose-spex-box
    identity: implementer
    run:
      env:
        FABER_AGENT_CLI: goose
        PORTITOR_HOST: portitor-faber-stack-service
        GOOSE_PROVIDER: openai
        GOOSE_MODEL: qwen/qwen3.8-27b
        GOOSE_MODE: auto
        OPENAI_HOST: http://faber-stack-service-llm:1234
        OPENAI_BASE_PATH: v1/chat/completions
        OPENAI_API_KEY: lm-studio
        GOOSE_DISABLE_KEYRING: "1"
    skill: fix
    model: qwen/qwen3.8-27b
    # <|think_low|> is the froggeric fixed-template's inline reasoning level.
    # Setup it requires (measured 2026-08-19): the fixed template installed for
    # this model in LM Studio AND the GGUF variant loaded — the llama.cpp
    # engine's tool-call parser survives a template override, the MLX one does
    # not. think_off dropped task parts; think_low kept compliance at ~1/8 the
    # tokens of stock xhigh.
    effort: "Follow the operating instructions exactly. Batch independent shell commands into a single call instead of one command per turn. <|think_low|>"
    invoke:
      profile: goose
    skills: [fix, go-expert]
    skills_link: .claude/skills
    hooks:
      context: fetch-pr
      postlude: post-answers
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      status: {type: string, required: true}

  merge:
    image: spex-box
    identity: merger
    run:
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-faber-stack-service}
    skill: merge
    model: claude-sonnet-5
    effort: low
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    skills: [merge]
    skills_link: .claude/skills
    hooks:
      postlude: post-merge
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      merged: {type: bool, required: true}
