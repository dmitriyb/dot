# templates library — composition nodes. Each aspect is a NAMED reference into a
# library: image -> images, identity -> identities, skill/skills -> skills,
# hooks.* -> hooks. The engine resolves every name; nothing here is inline. This
# is the project-flavored layer — workflows below reference these templates by
# name only, staying project-agnostic.
#
# output.json (the fields declared in `output:`) is how faber scores the step
# and feeds ${steps.<step>.<field>} onward. For implement* it is written by the
# finish-implement POSTLUDE (the ceremony is deterministic); review/fix/merge
# skills still write it as their last act.

templates:
  implement:
    image: spex-box
    identity: implementer
    run:
      resources: {memory: 8g, cpus: 4}
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-spex}  # PORTITOR_HOST: the gate container the pr/portitor client targets
    skill: implement
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    model: claude-sonnet-5
    effort: high
    skills: [implement, go-expert]
    skills_link: .claude/skills
    hooks:
      context: gather-context      # bead + spec -> CONTEXT.md (read-only, default branch)
      prelude: claim-bead          # branch off origin/main + signed in_progress claim
      postlude: finish-implement   # commit -> push -> PR# -> bead link -> describe -> output.json (deterministic)
      on_failure: release-bead     # host-side: undo the claim if the step fails
    inputs:
      repo: {type: string, required: true}
      bead: {type: string, required: true}
    output:
      branch: {type: string, required: true}
      pr:     {type: int,    required: true}

  # The epic pull-loop's implementer: same box, same skill, but instead of a
  # given bead id it takes the EPIC id and selects the next ready child bead
  # from INSIDE the box (next-bead-context; br + spex are in the image, so the
  # host needs neither). Output carries the done sentinel: {done:false, branch,
  # pr} on a work cycle, {done:true} when no ready bead remains, plus halt_reason/drift_files when a blocking drift halts the epic — the epic
  # workflow's outer loop settles on it.
  implement-next:
    image: spex-box
    identity: implementer
    run:
      resources: {memory: 8g, cpus: 4}
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-spex}  # PORTITOR_HOST: the gate container the pr/portitor client targets
    skill: implement
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    model: claude-sonnet-5
    effort: high
    agent_optional: true           # done-cycle: the prelude skips the agent (FABER_SKIP_AGENT); finish-implement emits the sentinel
    skills: [implement, go-expert]
    skills_link: .claude/skills
    hooks:
      context: next-bead-context   # next ready epic bead (or done-cycle) -> CONTEXT.md
      prelude: claim-next-bead     # branch off origin/main + signed in_progress claim
      postlude: finish-implement   # commit -> push -> PR# -> bead link -> describe -> output.json (deterministic)
      on_failure: release-bead     # host-side: logging no-op (claim dies with the box clone)
    inputs:
      repo: {type: string, required: true}
      epic: {type: string, required: true}
    output:
      done:   {type: bool,   required: true}
      branch: {type: string}
      pr:     {type: int}
      halt_reason: {type: string}   # settle sentinel: e.g. blocking_drift (set by the context hook's done-cycle)
      drift_files: {type: string}   # comma-joined drifts/ paths when halt_reason=blocking_drift

  review:
    image: spex-box
    identity: reviewer             # the ONLY role permitted to close beads (portitor role rule)
    run:
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-spex}  # PORTITOR_HOST: the gate container the pr/portitor client targets
    skill: review
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    model: claude-opus-5
    effort: high
    skills: [review, go-expert]
    skills_link: .claude/skills
    hooks:
      context: fetch-pr            # PR review state + threads -> CONTEXT.md, pr.json, threads.json
      postlude: post-review        # review.json -> gate-submitted review (internal verdict recorded); needs faber with the postlude phase
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      verdict: {type: string, enum: [approved, changes], required: true}

  fix:
    image: spex-box
    identity: implementer          # fixes are authored by the implementer identity
    run:
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-spex}  # PORTITOR_HOST: the gate container the pr/portitor client targets
    skill: fix
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    model: claude-sonnet-5
    effort: high
    agent_optional: true           # prepare-fix may resolve a pure `behind` cycle by itself and skip the agent
    skills: [fix, go-expert, implement]   # implement: the fix skill references its drift protocol rather than keeping a second copy
    skills_link: .claude/skills
    hooks:
      context: fetch-pr            # PR feedback + threads -> CONTEXT.md, pr.json, threads.json
      prelude: prepare-fix         # reopen a closed bead + merge the base in when behind; may skip the agent
      postlude: post-answers       # answers.json -> per-thread replies through the gate; needs faber with the postlude phase
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
      # Bound at the ci-fix call sites only: a review-feedback cycle has no land
      # blocker. The merge template already declares it as an output, so the
      # value travels as typed data instead of being re-read out of a comment.
      blocked_by: {type: string}
    output:
      status: {type: string, required: true}

  merge:
    image: spex-box                # shares the toolset; only needs git/openssh + the portitor client
    identity: merger               # commit-less landing identity (portitor action policy gates merge)
    run:
      # PORTITOR_HOST: the gate container the pr/portitor client targets.
      # CHECKS_*: the prelude's CLIENT-side policy — how long to wait overall, how
      # often to poll, how long an empty rollup is read as "the run has not
      # registered yet" rather than "this PR has no CI", how long a non-CLEAN
      # merge state on an all-green PR is read as forge lag rather than a
      # blocker, and how many times a checks read is retried before one network
      # blip decides the step. The per-check stuck budgets and the re-run
      # attempt cap are GATE-side (the per-repo `checks` config), so they stay
      # authoritative.
      env: {FABER_AGENT_CLI: claude, PORTITOR_HOST: portitor-spex,
            CHECKS_CEILING_SECONDS: "720", CHECKS_POLL_SECONDS: "10",
            CHECKS_APPEAR_SECONDS: "60", CHECKS_SETTLE_SECONDS: "90",
            CHECKS_API_TRIES: "3", CHECKS_API_RETRY_SECONDS: "5"}
    skill: merge
    invoke:   # inline over the built-in claude profile: session capture only
      session_dir: .claude/projects
      resume_argv: ["claude", "--continue"]
    # The agent runs ONLY on the exception branches (red CI, a stuck run, a
    # conflict) — the green path skips it entirely — so a capable model costs
    # almost nothing in aggregate and is worth it where judgement is needed.
    model: claude-opus-5
    effort: high
    agent_optional: true           # the prelude may skip the agent (FABER_SKIP_AGENT=1)
    skills: [merge]
    skills_link: .claude/skills
    hooks:
      prelude: wait-checks         # classify CI/merge state; land deterministically or hand to the agent
      postlude: post-merge         # land when the prelude cleared it; otherwise pass the agent's verdict through
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      merged: {type: bool, required: true}
      blocked_by: {type: string}   # ci_red | stuck | behind | dirty | merge_state — set when merged=false
