version: 1

# spexmachina project assembly. The substrate (root-only sections) lives here;
# the five component libraries are pulled in via include: and union-merged into
# one flat config before validation. Every included path resolves relative to
# the file that declares it; the substrate paths below resolve relative to THIS
# file.
#
# Run from THIS directory:
#   faber validate --config orchestrator.yaml [--emit-ir]
#   faber build    --config orchestrator.yaml
#   faber run bead --config orchestrator.yaml --param bead=<id>
#
# STATE: complete. Image (incl. the in-box portitor client), hooks, skills,
# templates, workflows. The gate side (roles, mirror, host-key pin) is stood up
# by `faber-stack up` — see ../SETUP.md; key wiring details in keys/README.md.

# --- substrate ---------------------------------------------------------------

network:
  name: spex-net                         # this repo's own faber internal network
  proxy: http://spex-egress:8888         # this repo's allow-list egress (api.anthropic.com only)
  no_proxy: [portitor-spex, localhost, 127.0.0.1]   # token rides in the box (file mode); proxy carries no secret

remote:                                  # portitor step: the box's ONLY git remote (per-repo instance)
  url: ssh://git@portitor-spex/srv/git   # security module splices <repo>.git per step
  host_key_file: ./keys/portitor_host_key.pub   # portitor step: pin portitor's SSH host key here

credentials:
  resolver: ../base/hooks/get-token      # host-side get_token(service); reads the macOS keychain
  services:
    claude_code_oauth_token:             # file mode -> /run/secrets -> env CLAUDE_CODE_OAUTH_TOKEN
      mode: file                         # (the var Claude Code honors); shredded after the run

identities:                             # resolved by role NAME via the faber registry (`faber add-key`):
  implementer: {}                        #   name -> fingerprint (registry) -> the matching key in ~/.ssh.
  reviewer:    {}                        # reviewer is the only role portitor lets sign bead-closes,
  merger:      {}                        # merger the only one it lets merge (portitor policy).

# --- component libraries -----------------------------------------------------

# ../base is the SHARED library: one copy of the images, skills and hooks every
# project in this tree runs. Editing it edits every project — that is the point.
# What stays here is what is genuinely this project's: the substrate above, the
# templates (they carry PORTITOR_HOST, this instance's gate) and the workflows
# (their `repo` param default names this project's repo).
include:
  - ../base/images.yaml    # spex-box (pinned toolset + overlay)
  - ../base/skills.yaml    # implement / review / fix / merge / go-expert
  - ../base/hooks.yaml     # context / prelude / postlude hooks for every role
  - templates.yaml         # implement / review / fix / merge
  - workflows.yaml         # bead (Gate B) / epic (Gate A)
