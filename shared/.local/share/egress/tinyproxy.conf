# Egress proxy for a faber box network. The box runs on an --internal docker
# network (no direct internet); its only outbound path is this proxy, which is
# allow-listed to the Anthropic API. Everything else is denied — closing
# exfiltration + any REST/libgit2 bypass to arbitrary hosts.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
StartServers 2
LogLevel Info

# Who may use the proxy: the internal faber box network (private ranges only).
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Only allow CONNECT (HTTPS) to 443.
ConnectPort 443

# Host allow-list: deny unless the requested host matches the filter file.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
