# AeroSpace configuration. Stowed to ~/.config/aerospace/aerospace.toml by setup.sh.
#
# The letter workspaces, their chords and their auto-placement rules are mirrored in
# arch/.config/omarchy/custom-hyprland.lua. Nothing generates either file -- when a
# workspace is added or renamed, edit both by hand.
#
# Chords are chosen so macOS and Linux share one muscle memory: `option` here and
# `SUPER` on the Linux box sit in the same physical position, so `alt-t` and `SUPER+T`
# are the same key under the same finger.
#
# Reference: https://nikitabobko.github.io/AeroSpace/commands

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = 'accordion'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 4
outer.bottom = 4
outer.top = 4
outer.right = 4

# Monitor sequence numbers, left to right. Deliberately indices and not AeroSpace's
# 'main' / 'secondary' / 'built-in' patterns: the two work displays are the same model
# and report the same name, so a name regex matches both, and 'secondary' is ambiguous
# with three displays attached -- it does not pin this group to the second panel. A
# position is the only thing that separates them.
[workspace-to-monitor-force-assignment]
E = 1  # scratch / main empty
T = 1  # Telegram
F = 1  # Firefox
G = 1  # terminals
Z = 1  # Zed
C = 2  # Chrome (work)
S = 2  # Slack
I = 2  # IntelliJ IDEA
O = 2  # CLion
P = 2  # PyCharm
B = 3  # empty built-in display

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
#
# All possible modifiers: cmd, alt, ctrl, shift

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Full screen. Mirrors SUPER+M on Linux ("maximize"), where the letter layer took
# SUPER+F. There was no fullscreen binding here at all before.
alt-m = 'fullscreen'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize. Deliberately alt-, not alt-cmd-: cmd appeared nowhere else in this config, and
# Hyprland resizes with SUPER+minus / SUPER+equal, so this is now the same chord on both.
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Letter workspaces. `alt-<letter>` switches, `alt-shift-<letter>` moves the focused
# window there and follows it (--focus-follows-window), which is what Hyprland's
# SUPER+SHIFT+<letter> does; without the flag the same chord would behave differently
# on each machine.
alt-e = 'workspace E'  # scratch / main empty
alt-shift-e = 'move-node-to-workspace E --focus-follows-window'
alt-t = 'workspace T'  # Telegram
alt-shift-t = 'move-node-to-workspace T --focus-follows-window'
alt-f = 'workspace F'  # Firefox
alt-shift-f = 'move-node-to-workspace F --focus-follows-window'
alt-g = 'workspace G'  # terminals
alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
alt-z = 'workspace Z'  # Zed
alt-shift-z = 'move-node-to-workspace Z --focus-follows-window'
alt-c = 'workspace C'  # Chrome (work)
alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
alt-s = 'workspace S'  # Slack
alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
alt-i = 'workspace I'  # IntelliJ IDEA
alt-shift-i = 'move-node-to-workspace I --focus-follows-window'
alt-o = 'workspace O'  # CLion
alt-shift-o = 'move-node-to-workspace O --focus-follows-window'
alt-p = 'workspace P'  # PyCharm
alt-shift-p = 'move-node-to-workspace P --focus-follows-window'
alt-b = 'workspace B'  # empty built-in display
alt-shift-b = 'move-node-to-workspace B --focus-follows-window'

# Hyprland's SUPER+TAB is bound to the same back-and-forth, and SUPER+SHIFT+TAB to the
# same move-to-next-monitor, so these two chords match on both machines.
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Window mode. Hyprland binds SUPER+SHIFT+SEMICOLON to an equivalent submap, with the
# same inner letters wherever the verb exists on both.
alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Auto-placement. Mirrors the o.window() rules in custom-hyprland.lua. The two lists
# have drifted before (9 rules here against 5 there) -- when one changes, change both.
[[on-window-detected]]
if.app-id = 'com.tdesktop.Telegram'
run = 'move-node-to-workspace T'  # Telegram

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace F'  # Firefox

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace G'  # terminals

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace Z'  # Zed

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace C'  # Chrome (work)

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'  # Slack

[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = 'move-node-to-workspace I'  # IntelliJ IDEA

[[on-window-detected]]
if.app-id = 'com.jetbrains.CLion'
run = 'move-node-to-workspace O'  # CLion

[[on-window-detected]]
if.app-id = 'com.jetbrains.PyCharm'
run = 'move-node-to-workspace P'  # PyCharm
