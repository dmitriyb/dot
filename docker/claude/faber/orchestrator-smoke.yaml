version: 1

# SMOKE — prove faber's spine end to end on the host: nix build -> docker load
# -> docker run (non-root box, writable mounts) -> skills mount + symlink ->
# headless agent (REAL Claude, personal account) -> schema-valid result.json.
# Gateless: no gateway, no repo clone; the only security surface is the personal
# Anthropic credential (file mode). If this passes, the whole box contract works.
#
# Prereqs (host):
#   - overlay hashes filled (claude-code resolves under the pin),
#   - the personal Claude Code setup-token in the keychain:
#       claude setup-token
#       security add-generic-password -s anthropic -a personal -w '<token>'
#   - ./hooks/get-token executable; ./skills/summarize/SKILL.md present.
#
# Run from THIS directory (every ./ path is CWD-relative):
#   faber validate --config orchestrator-smoke.yaml
#   faber build    --config orchestrator-smoke.yaml
#   faber run smoke --config orchestrator-smoke.yaml --param topic="hello faber"

credentials:
  resolver: ./hooks/get-token            # host-side; get_token(service) -> token on stdout
  services:
    claude_code_oauth_token:             # file mode -> /run/secrets/... -> env CLAUDE_CODE_OAUTH_TOKEN
      mode: file

templates:
  smokebox:                              # NOT "smoke": a template may not share a name with a workflow
    build:
      packages: [coreutils, bash, claude-code] # bash: Claude's Bash tool needs a shell; claude-code from the overlay
      overlay: ./overlay.nix
    run:
      env: {FABER_AGENT_CLI: claude}
    skill: summarize
    skills:                              # delivered read-only at /faber/skills, symlinked to ~/.claude/skills
      dir: ./skills
      link: .claude/skills
    inputs:
      topic: {type: string, required: true}
    output:
      summary: {type: string, required: true}

workflows:
  smoke:
    params:
      topic: {type: string, required: true}
    steps:
      - id: smoke
        use: smokebox
        with: {topic: "${params.topic}"}
