version: 1

# GATELESS SMOKE — run this FIRST on the host to prove faber's untested spine
# end to end (nix build -> docker load -> docker run -> headless agent ->
# schema-valid result.json) with ZERO security surface. No network, no gateway,
# no credentials, no repo clone. If this passes, image+run+agent+extract all work.
#
# Run from THIS directory (overlay path is CWD-relative):
#   faber validate --config orchestrator-smoke.yaml     # nix-eval proof; needs the overlay hashes filled
#   faber build    --config orchestrator-smoke.yaml     # nix build + docker load
#   faber run smoke --config orchestrator-smoke.yaml --param topic="hello faber"

templates:
  smoke:
    build:
      packages: [coreutils, claude-code]     # claude-code comes from the overlay
      overlay: ./overlay.nix
    run:
      env: {FABER_AGENT_CLI: claude}
    skill: summarize                          # any trivial skill; the point is the round-trip
    inputs:
      topic: {type: string, required: true}
    output:
      summary: {type: string, required: true}

workflows:
  smoke:
    params:
      topic: {type: string, required: true}
    steps:
      - id: smoke
        use: smoke
        with: {topic: "${params.topic}"}
