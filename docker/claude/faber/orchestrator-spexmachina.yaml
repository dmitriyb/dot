version: 1

# GATE B (single-bead -> review loop -> auto-merge) for spexmachina, adapted from
# examples/code-review-loop. Reuses dot's proven substrate: the dca-egress proxy,
# the portitor gateway, per-role signing keys, and dot's already-prelude-driven
# implement/review/fix skills. Trial this on the small Batch-B bugs (Phase 5)
# before the big remediation epic.
#
# Run from THIS directory (overlay + hook + key paths are CWD-relative).
# Only run after the gateless smoke passes and portitor has spexmachina onboarded.

network:
  name: dca-net                          # dot's internal docker network (docker-claude --portitor)
  proxy: http://dca-egress:8888          # dot's allow-list egress (api.anthropic.com only)
  no_proxy: [portitor, localhost, 127.0.0.1]

remote:
  url: ssh://git@portitor/srv/git        # box's ONLY git remote; box splices <repo>.git
  host_key_file: ./keys/portitor_host_key.pub   # TODO: portitor's SSH host key (pin it)

credentials:
  resolver: ./hooks/get-token            # TODO: host-side get_token(service); dot keychain read
  services:
    anthropic:
      mode: file                         # or proxy via a token-proxy; file = tmpfs, shredded
      endpoint: ""                       # unused for mode:file

identities:                              # one ephemeral single-key ssh-agent per box
  implementer: {key: ./keys/implementer} # TODO: dot ~/.dca-keys/<role> or FIDO2 sk key refs
  reviewer:    {key: ./keys/reviewer}
  merger:      {key: ./keys/merger}

templates:
  implement:
    build:
      packages: [git, openssh, go, gopls, coreutils, br, spex, claude-code]
      overlay: ./overlay.nix
    run:
      identity: implementer
      resources: {memory: 8g, cpus: 4}
      env: {FABER_AGENT_CLI: claude}
    skill: implement                     # dot's prelude-driven implement skill
    hooks:
      context: ./hooks/gather-context    # TODO: wrap dot's start-implement (bundle + spex map context)
      prelude: ./hooks/claim-bead        # TODO: br update <id> --status in_progress (signed)
      on_failure: ./hooks/release-bead
    inputs:
      repo: {type: string, required: true}
      bead: {type: string, required: true}
    output:
      branch: {type: string, required: true}
      pr:     {type: int,    required: true}

  review:
    build:
      packages: [git, openssh, go, br, spex, claude-code]
      overlay: ./overlay.nix
    run:
      identity: reviewer
      env: {FABER_AGENT_CLI: claude}
    skill: review                        # dot's review skill (the ONLY role that closes beads)
    hooks:
      context: ./hooks/fetch-pr
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      verdict: {type: string, enum: [approved, changes], required: true}

  fix:
    build:
      packages: [git, openssh, go, gopls, br, spex, claude-code]
      overlay: ./overlay.nix
    run:
      identity: implementer
      env: {FABER_AGENT_CLI: claude}
    skill: fix
    hooks:
      context: ./hooks/fetch-pr
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      status: {type: string, required: true}

  merge:
    build:
      packages: [git, openssh]           # merger is a commit-less landing identity
    run:
      identity: merger
      env: {FABER_AGENT_CLI: claude}
    skill: merge                         # runs `portitor pr merge` (role-gated in policy.go)
    inputs:
      repo: {type: string, required: true}
      pr:   {type: int,    required: true}
    output:
      merged: {type: bool, required: true}

workflows:
  bead:                                  # Gate B: one bead through implement -> review-loop -> merge
    params:
      repo: {type: string, required: true, default: spexmachina}
      bead: {type: string, required: true}
    steps:
      - id: implement
        use: implement
        with: {repo: "${params.repo}", bead: "${params.bead}"}
      - id: review-cycle
        loop:
          max: 3
          until: steps.review.verdict == "approved"
          steps:
            - id: review
              use: review
              with: {repo: "${params.repo}", pr: "${steps.implement.pr}"}
            - id: fix
              use: fix
              when: steps.review.verdict == "changes"
              with: {repo: "${params.repo}", pr: "${steps.implement.pr}"}
      - id: merge
        use: merge
        when: steps.review.verdict == "approved"
        with: {repo: "${params.repo}", pr: "${steps.implement.pr}"}

# Gate A (epic -> ONE big PR, human-checked) is a batch-fanout variant: a
# `generate` source lists the epic's child beads (spex map / br), each fans into
# an `implement` box on ONE shared integration branch, then a single review pass;
# NO merge step (you review + merge the PR by hand). Draft that as a second
# workflow once Gate B is proven on Batch B. See examples/batch-fanout.
