# Declarative portitor stack: the proxy + the agent egress proxy + the internal
# network. Brought up via `docker-claude --portitor up`, which builds the images
# and exports GH_TOKEN / AGENT_AUTHORIZED_KEY / PORTITOR_CONFIG_DIR from the
# keychain + your keys dir before `docker compose up -d`. Replaces the imperative
# deploy/run.sh + manual `docker network connect`.
#
# portitor + dca-egress sit on the default (internet) network AND dca-net; the
# dca agent containers join dca-net ONLY (no direct internet) and reach portitor
# by name. The portitor-repos volume (mirrors) + the host config dir persist, so
# `up` after a `down` is instant — no re-mirror, no re-init.
name: portitor

services:
  portitor:
    image: portitor                 # built by docker-claude from $PORTITOR_REPO
    container_name: portitor        # agents reach it as ssh://git@portitor on dca-net
    restart: unless-stopped
    environment:
      # left optional so down/status don't fail interpolation when unset.
      AGENT_AUTHORIZED_KEY: ${AGENT_AUTHORIZED_KEY:-}
    # GH_TOKEN comes in as a SECRET (mounted at /run/secrets/gh_token), not an env var,
    # so it never shows in `docker inspect portitor`. The entrypoint reads the file.
    secrets:
      - gh_token
    volumes:
      - ${PORTITOR_CONFIG_DIR:?host config dir (portitor.json + repos.d/ + allowed_signers)}:/etc/portitor:ro
      - portitor-repos:/srv/git     # bare mirrors + per-repo hooks (persist across down/up)
    networks: [default, dca-net]

  dca-egress:
    image: dca-egress-proxy         # built by docker-claude from docker/claude/egress
    container_name: dca-egress
    restart: unless-stopped
    networks: [default, dca-net]

networks:
  dca-net:
    name: dca-net                   # fixed name (no compose prefix) so `dca --network dca-net` matches
    internal: true                  # agents on this net have no direct internet

volumes:
  portitor-repos:
    name: portitor-repos

secrets:
  # Sourced from the GH_TOKEN env that docker-claude --portitor up exports (from the
  # keychain); Compose exposes it as a file at /run/secrets/gh_token in the container
  # instead of an env var. Requires Docker Compose v2.x (environment-sourced secrets).
  gh_token:
    environment: GH_TOKEN
