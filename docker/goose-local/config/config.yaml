# goose scratch config: OpenAI-compatible server (LM Studio) on the container
# host. Mounted rw at /root/.config/goose/config.yaml by run.sh — edit and
# rerun, no image rebuild. GOOSE_MODEL must equal the id the server reports at
# GET /v1/models.
GOOSE_PROVIDER: openai
GOOSE_MODEL: qwen/qwen3.8-27b
OPENAI_HOST: http://host.docker.internal:1234
OPENAI_BASE_PATH: v1/chat/completions
GOOSE_MODE: auto
extensions:
  developer:
    enabled: true
    type: builtin
    name: developer
    timeout: 300
