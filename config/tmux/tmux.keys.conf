# Tmux Keybindings

# Prefix
unbind C-b
set -g prefix C-a

# Double-tap for last window
bind C-a last-window

# Send prefix to nested (Docker) tmux (C-a a → sends C-b)
bind a send-key C-b

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim pane resize
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window navigation (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# New window (preserve path)
bind c new-window -c "#{pane_current_path}"

# Splits (preserve path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Lazygit popup
bind g popup -d '#{pane_current_path}' -E -w 90% -h 90% lazygit

# Sesh session management
bind "T" display-popup -E -w 55% -h 60% "sesh connect \"$(
  sesh list -i | fzf \
    --no-sort --ansi --border-label ' sesh ' \
    --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^f find ^y kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list -i)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -it)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -iz)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .git . ~)' \
    --bind 'ctrl-y:execute-silent(tmux kill-session -t {2..})+reload(sesh list -i)'
)\""
bind "L" run-shell "sesh last"

# New session from $HOME (prompts for name)
bind C command-prompt -p "New session name:" "new-session -c '~' -s '%%'"
