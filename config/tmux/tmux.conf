# Tmux Configuration

# Source keybindings
source-file ~/.config/tmux/tmux.keys.conf

# General settings
set -sg escape-time 1
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g status-position top
set -g focus-events on
set -g history-limit 10000

# Reset cached catppuccin variables on reload
source-file -q ~/.config/tmux/catppuccin-reset.conf

# Create catppuccin custom flavor symlink (recreated on every reload for theme switches)
# Omarchy (Arch): palette generated/hand-crafted in ~/.config/omarchy/current/theme/
# macOS fallback: palette from ~/.config/themes/current/
if-shell "test -f ~/.config/omarchy/current/theme/catppuccin-palette.conf" \
    "run 'ln -sf ~/.config/omarchy/current/theme/catppuccin-palette.conf ~/.tmux/plugins/tmux/themes/catppuccin_custom_tmux.conf'" \
    "run 'ln -sf ~/.config/themes/current/catppuccin-palette.conf ~/.tmux/plugins/tmux/themes/catppuccin_custom_tmux.conf'"

# Catppuccin plugin settings
set -g @catppuccin_flavor "custom"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text " %H:%M"

# TPM Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'jaclu/tmux-menus'

# Plugin settings
set -g @continuum-restore 'on'
set -g @menus_trigger 'Space'

# Status line (#{E:...} is evaluated lazily at render time, so these can be set before TPM)
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100

# Initialize TPM (keep at bottom so plugins like continuum can append to status-right)
# Linux (AUR package)
if-shell "test -f /usr/share/tmux-plugin-manager/tpm" \
    "run '/usr/share/tmux-plugin-manager/tpm'"
# macOS (Homebrew)
if-shell "test -f /opt/homebrew/opt/tpm/share/tpm/tpm" \
    "run '/opt/homebrew/opt/tpm/share/tpm/tpm'"
# Fallback (manual clone)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" \
    "run '~/.tmux/plugins/tpm/tpm'"
